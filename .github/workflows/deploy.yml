name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Requiere que GitHub Pages esté activado una vez a mano, en
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      #
      # No se puede automatizar con `enablement: true`: crear el sitio por API exige derechos
      # de administración del repositorio, y el GITHUB_TOKEN de Actions no los tiene
      # ("Resource not accessible by integration"). Es un paso único; después, cada push a
      # main despliega solo.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
