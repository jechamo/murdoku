name: Desplegar en GitHub Pages

on:
  push:
    # El entorno `github-pages` trae de serie una regla que solo permite desplegar desde la
    # rama por defecto del repositorio, y aquí la rama por defecto quedó siendo la de trabajo
    # (fue la primera que se empujó al repo vacío), no `main`.
    #
    # Cada push actualiza las dos ramas, así que saltan dos tiradas. Se compila y se pasan los
    # tests en las dos, pero publicar solo publica la rama por defecto, sea cual sea (ver el
    # `if` del job `deploy`): así esto sigue funcionando el día que la rama por defecto pase a
    # ser `main`, sin tocar nada. Entonces sobrará la segunda rama de esta lista.
    branches: [main, claude/murdocku-online-hpio37]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Por rama, no global: con un único grupo las dos tiradas del mismo push se cancelaban entre
# ellas, y la que sobrevivía era justo la que el entorno rechaza. El despliegue de verdad no
# corre riesgo de solaparse, porque solo una rama llega al job `deploy`.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Requiere que GitHub Pages esté activado una vez a mano, en
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      #
      # No se puede automatizar con `enablement: true`: crear el sitio por API exige derechos
      # de administración del repositorio, y el GITHUB_TOKEN de Actions no los tiene
      # ("Resource not accessible by integration"). Es un paso único; después, cada push a
      # main despliega solo.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Solo publica la rama por defecto, que es la única que el entorno `github-pages` admite.
    # La otra se queda en compilar y pasar los tests, que como señal de CI ya vale.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # La acción se queda esperando a que Pages dé por buena la publicación, y se ha visto
          # colgada más de veinte minutos sin decir nada. Mejor que se rinda pronto y falle a la
          # vista que dejar una tirada eterna aparentando que está trabajando.
          timeout: 300000
