name: Desplegar en GitHub Pages

on:
  push:
    # El entorno `github-pages` trae de serie una regla que solo permite desplegar desde la
    # rama por defecto del repositorio, y aquí la rama por defecto quedó siendo la de trabajo
    # (fue la primera que se empujó al repo vacío), no `main`. Por eso los push a `main` se
    # rechazaban con "Branch main is not allowed to deploy to github-pages".
    #
    # Se disparan las dos mientras dure esa situación. Cuando la rama por defecto pase a ser
    # `main` (Settings -> General -> Default branch), sobra la segunda.
    branches: [main, claude/murdocku-online-hpio37]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Requiere que GitHub Pages esté activado una vez a mano, en
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      #
      # No se puede automatizar con `enablement: true`: crear el sitio por API exige derechos
      # de administración del repositorio, y el GITHUB_TOKEN de Actions no los tiene
      # ("Resource not accessible by integration"). Es un paso único; después, cada push a
      # main despliega solo.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
